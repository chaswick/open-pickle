<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public}">
<head><title layout:fragment="title">Join session</title><meta name="robots" content="noindex,nofollow"></head>
<body>
<main layout:fragment="content" class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <section class="card shadow-sm">
        <div class="card-header card-header-title text-center"><h1 class="card-section-title" th:text="${invitedSession != null ? invitedSession.title : 'Join session'}">Join session</h1></div>
        <div class="card-body p-4">
          <p class="text-muted" th:if="${invitedSession != null and invitedSession.sessionDateLabel != null}"
             th:text="${invitedSession.sessionDateLabel}"></p>
          <p class="alert alert-danger" role="alert" th:if="${joinError}" th:text="${joinError}"></p>
          <form th:if="${inviteAvailable == true and playerAccessEnabled == true}" method="post" th:action="@{/join/session}" data-submit-label="Joining…">
            <input type="hidden" name="inviteCode" th:value="${inviteCode}">
            <input type="hidden" name="direct" th:value="${directJoin}">
            <input type="hidden" name="formToken" th:value="${formToken}">
            <div class="d-none" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
            <label for="player-name" class="form-label fw-semibold">What should we call you?</label>
            <input id="player-name" name="name" class="form-control form-control-lg mb-3" type="text"
                   required autofocus autocomplete="nickname" th:maxlength="${nameMaxLength}" th:value="${enteredName}">
            <div class="form-check mb-3">
              <input id="join-terms" class="form-check-input" type="checkbox" name="acceptTerms" value="true" checked required>
              <label for="join-terms" class="form-check-label small">I agree to the <a th:href="@{/terms}" target="_blank" rel="noopener">terms</a> and <a th:href="@{/privacy}" target="_blank" rel="noopener">privacy policy</a>.</label>
            </div>
            <p class="small text-muted" th:if="${invitedSession.organizerScored}">The organizer records scores. Results are confirmed automatically.</p>
            <button type="submit" class="btn btn-action-primary btn-lg w-100" th:text="${directJoin ? 'Join session' : 'Ask to join'}">Join session</button>
          </form>
          <p class="small mt-3 mb-0" th:if="${inviteAvailable == true}">
            Already have an account?
            <a th:href="@{/login(returnTo=${'/groups/join?inviteCode=' + inviteCode + '&amp;autoJoin=' + directJoin})}">Sign in</a>
            or go <a th:href="@{/}">Home</a>
          </p>
          <p class="small mt-2 mb-0" th:if="${inviteAvailable == true and playerAccessEnabled != true}">
            <a th:href="@{/register}">Create an account</a> to join.
          </p>
          <a class="small d-inline-block mt-3" th:if="${inviteAvailable != true}" th:href="@{/}">Home</a>
        </div>
      </section>
    </div>
  </div>
</main>
</body>
</html>
