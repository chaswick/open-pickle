<section th:fragment="recovery" th:if="${canEditDisplayName == true and loggedInUser != null and loggedInUser.nameOnlyAccount}"
         class="card mb-4 shadow card-spotlight">
  <div class="card-header card-header-title text-center">Keep access to your account</div>
  <div class="card-body">
    <p>Connect an email to sign in on another device or after clearing browser data. Your scores and trophies stay with you.</p>
    <a class="btn btn-nav-primary" th:if="${playerAccessEnabled}" th:href="@{/account/connect-email}">Connect email</a>
  </div>
</section>

<aside th:fragment="email-reminder" th:if="${showConnectEmailReminder == true}" class="card shadow-sm mb-4" data-connect-email-reminder>
  <div class="card-header card-header-title text-center"><h2 class="card-section-title">Keep access to your scores</h2></div>
    <div class="card-body text-start">

    <p>Connect an email so you can sign back in if you change phones or clear your browser.</p>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-nav-primary" th:href="@{/account/connect-email}">Connect email</a>
      <form method="post" th:action="@{/account/connect-email/dismiss}" class="m-0">
        <button class="btn btn-nav-secondary" type="submit">Not now</button>
      </form>
    </div>
  </div>
</aside>
