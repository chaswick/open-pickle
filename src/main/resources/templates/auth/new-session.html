<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/authenticated}">
<head>
  <title layout:fragment="title">Start a session</title>
  <th:block layout:fragment="styles">
    <link rel="stylesheet" href="/css/session-matchups.css" th:href="@{/css/session-matchups.css(v=${assetVersion})}">
  </th:block>
</head>
<body>
<div layout:fragment="content" class="app-page session-create-page">
  <div class="app-page-header"><div>
    <h1 class="app-page-title">Host a session</h1>
    <p class="app-page-subtitle">Start your group here. Friends join with your invite.</p>
  </div></div>
  <div th:replace="~{components/back-button :: back-button(@{/home}, 'Back')}"></div>
  <form method="post" th:action="@{/groups/create-session}" class="session-intent-form" data-submit-label="Creating session…">
    <section class="card session-when-card" data-card-collapse="off" aria-labelledby="session-when-title">
      <div class="card-header card-header-title"><h2 id="session-when-title" class="card-section-title session-create-step-title"><span class="session-step-number" aria-hidden="true">1</span> When are you playing?</h2></div>
      <div class="card-body">
      <div class="session-when-options" role="radiogroup" aria-labelledby="session-when-title">
        <label><input type="radio" name="sessionWhen" value="NOW"
                      th:checked="${sessionWhen != 'LATER'}" th:disabled="${sessionNowAvailable == false}"><span>Now</span></label>
        <span class="session-choice-or" aria-hidden="true">or</span>
        <label><input type="radio" name="sessionWhen" value="LATER"
                      th:checked="${sessionWhen == 'LATER'}"><span>Later</span></label>
      </div>
      <p class="small text-muted mb-0" th:if="${sessionNowAvailable == false}">You're hosting a session now. You can plan another for later.</p>
      <div data-session-date-choice th:hidden="${sessionWhen != 'LATER'}">
        <label for="session-date" class="form-label">Playing date</label>
        <input id="session-date" name="sessionDate" type="date" class="form-control"
               th:value="${sessionDate}" th:min="${sessionMinDate}" th:max="${sessionMaxDate}"
               th:required="${sessionWhen == 'LATER'}" th:disabled="${sessionWhen != 'LATER'}"
               aria-describedby="session-date-note">
        <label for="session-time" class="form-label mt-3">Start time</label>
        <select id="session-time" name="sessionTime" class="form-select"
                th:required="${sessionWhen == 'LATER'}" th:disabled="${sessionWhen != 'LATER'}"
                aria-describedby="session-date-note">
          <option value="">Choose a time</option>
          <option th:each="slot : ${sessionStartTimes}" th:value="${slot.key}" th:text="${slot.value}"
                  th:selected="${slot.key == sessionTime}">6:30 PM</option>
        </select>
        <p id="session-date-note" class="small text-muted mt-2 mb-0">Friends can join ahead of time. Date and time use <span th:text="${sessionTimeZone}">your timezone</span>.</p>
      </div>
      </div>
    </section>
    <section class="card session-when-card" data-card-collapse="off" aria-labelledby="session-play-title">
      <div class="card-header card-header-title"><h2 id="session-play-title" class="card-section-title session-create-step-title"><span class="session-step-number" aria-hidden="true">2</span> How are you playing?</h2></div>
      <div class="card-body">
      <p class="small text-muted mb-0">Choose one.</p>
      <div class="session-play-options" role="radiogroup" aria-labelledby="session-play-title">
        <div class="session-intent-card">
          <label class="session-intent-option">
            <input type="radio" name="playMode" value="MATCHUPS" th:checked="${sessionPlayMode == null or sessionPlayMode.name() == 'MATCHUPS'}">
            <span><strong>Round robin</strong><span>Invite your players, mix partners or keep teams together, and follow a schedule.</span></span>
            <i class="bi bi-grid" aria-hidden="true"></i>
          </label>
          <label class="session-scoring-option" data-organizer-scoring-choice
                 th:hidden="${sessionPlayMode != null and sessionPlayMode.name() == 'OPEN_PLAY'}">
            <input type="checkbox" name="organizerScored" value="true" class="form-check-input mt-1" th:checked="${sessionOrganizerScored == true}"
                   th:disabled="${sessionPlayMode != null and sessionPlayMode.name() == 'OPEN_PLAY'}">
            <span><strong>Organizer records scores</strong><span>Scores are confirmed automatically.</span></span>
          </label>
        </div>
        <span class="session-choice-or" aria-hidden="true">or</span>
        <div class="session-intent-card">
          <label class="session-intent-option">
            <input type="radio" name="playMode" value="OPEN_PLAY" th:checked="${sessionPlayMode != null and sessionPlayMode.name() == 'OPEN_PLAY'}">
            <span><strong>Log games as we go</strong><span>Choose your own pairings. Someone on the opposing team needs to confirm the match results.</span></span>
            <i class="bi bi-pencil-square" aria-hidden="true"></i>
          </label>
        </div>
      </div>
      </div>
    </section>
    <section class="card session-when-card" data-card-collapse="off" aria-labelledby="session-name-title">
      <div class="card-header card-header-title"><h2 id="session-name-title" class="card-section-title session-create-step-title"><span class="session-step-number" aria-hidden="true">3</span><label for="session-name" class="mb-0">Session name <span class="text-muted fw-normal">(optional)</span></label></h2></div>
      <div class="card-body">
      <input id="session-name" name="sessionName" type="text" class="form-control"
             th:value="${sessionName}" th:maxlength="${sessionNameMaxLength}" placeholder="e.g. Amateur Bracket">
      </div>
    </section>
    <button type="submit" class="btn btn-action-primary w-100">Create session</button>
  </form>
</div>
<th:block layout:fragment="scripts"><script th:src="@{/js/session-matchups.js(v=${assetVersion})}"></script></th:block>
</body></html>
